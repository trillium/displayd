name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests (-rs reports skips)
        run: |
          python3 -m pytest -q -rs tests | tee pytest.out
          tail -n 1 pytest.out | tee -a "$GITHUB_STEP_SUMMARY"
