name: line-limit
on:
  push:
    branches: [main]
  pull_request:
jobs:
  line-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 250-line limit on non-test files
        run: python3 tools/check-lines.py
