<!DOCTYPE html>
<!--
  The options surface: the tap-anywhere landing screen
  (renderers/options.py). It is the shared panel chrome from layout.html
  -- header bands, side gesture strips, footer -- plus ONE addition, a
  name layer, because a two-column grid of view names cannot be expressed
  as ten text variables. The names are absolutely positioned by the
  renderer at the very rectangles renderers/_options_grid.grid_geometry()
  hands out, so a drawn name and the geometry that positions it cannot
  drift apart.

  It is deliberately NOT a selecting surface. Options NAMES the picks and
  the way back; the picker (picker.html) SELECTS. A tap while already here
  just re-shows this view, so neither screen traps the user.

  VARIABLE CONTRACT -- the chrome slots this surface actually draws, with
  layout.html's names and its "empty collapses the slot" rule. Pinned
  against _options_grid.chrome() by a test, so the file and the renderer
  cannot drift apart:

      eyebrow      small dim label above the title
      title        the header text (the view's `title` param)
      status       right-hand state: how many picks are named
      subtitle     one dim line under the title (the `instructions` param)
      hint_left    label in the left gesture strip
      hint_right   label in the right gesture strip
      footer       small bottom-left status
      footer_right small bottom-right status

      background   panel colour behind everything (a #rrggbb string the
                   renderer parsed out of the params, never raw caller
                   text -- so a style attribute here cannot be injected)
      color        primary text colour, same rule
      dim          secondary text colour, same rule
      accent       the accent rule under the title, same rule

  plus ONE raw slot:

      {{names|raw}}   the name markup, built by renderers/options.py

  The raw slot is the one place a document receives markup, and it is
  reachable only from a renderer, never from a caller: /show and
  /feed/html/vars always escape every value, and the only raw value here
  is name divs this repo generates from grid_geometry() plus names that
  were escaped before they went in. A caller-supplied `views` entry can
  therefore never add markup -- see renderers/_html_templates.py.

  Sized for a 1920x1080 panel read from across a room: the title is the
  biggest type, names are big enough to identify at a distance, and the
  grid sits between two dim 160px gesture strips. litehtml lays the frame
  out to whatever viewport it is given, so a smaller panel keeps the same
  content; only the type size is fixed, because litehtml has no
  viewport-relative units. Note litehtml drops `gap` on a flex row whose
  children grow -- spacing here is padding and margins, never `gap`.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #07080c; color: #eef2fa; font-family: sans-serif;
               height: 100%; }
  .frame { display: flex; height: 100%; }
  .strip { width: 160px; background: #0b0d13; }
  .strip .hint { font-size: 30px; color: #5c6780; text-align: center;
                 padding-top: 470px; }
  .main { width: 1600px; display: flex; flex-direction: column; }
  .head { display: flex; justify-content: space-between; align-items: baseline;
          padding: 40px 64px 0 64px; }
  .head .eyebrow { font-size: 26px; font-weight: bold; color: #7fd1ff; }
  .head .status { font-size: 26px; color: #8b93a7; }
  .title { font-size: 96px; font-weight: bold; color: #ffffff;
           text-align: center; padding: 12px 64px 0 64px; }
  .rule { height: 4px; background: {{accent}}; margin: 22px 64px 0 64px; }
  .lead { font-size: 44px; color: {{dim}}; text-align: center;
          padding: 20px 64px 0 64px; }
  .foot { margin-top: auto; display: flex; justify-content: space-between;
          align-items: baseline; padding: 0 64px 40px 64px; }
  .foot .l { font-size: 26px; color: #6f7b93; }
  .foot .r { font-size: 26px; color: #6f7b93; }
  .layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .cell { position: absolute; }
  .cell .name { position: absolute; font-weight: bold; }
</style>
</head>
<body style="background: {{background}}; color: {{color}};">
  <div class="frame">
    <div class="strip"><div class="hint">{{hint_left}}</div></div>
    <div class="main">
      <div class="head">
        <div class="eyebrow">{{eyebrow}}</div>
        <div class="status">{{status}}</div>
      </div>
      <div class="title">{{title}}</div>
      <div class="rule"></div>
      <div class="lead">{{subtitle}}</div>
      <div class="foot">
        <div class="l">{{footer}}</div>
        <div class="r">{{footer_right}}</div>
      </div>
    </div>
    <div class="strip"><div class="hint">{{hint_right}}</div></div>
  </div>
  <div class="layer">{{names|raw}}</div>
</body>
</html>
