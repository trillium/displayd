<!DOCTYPE html>
<!--
  A working example template, and the seed to copy. This directory IS the
  template root ($DISPLAYD_HTML_TEMPLATES, default html-templates/ next
  to the daemon). Copy it, edit the CSS, then:

      POST /show {"renderer": "html",
                  "params": {"template": "status.html",
                             "vars": {"title": "BUILD", "sub": "12:04",
                                      "value": "142", "unit": "taps",
                                      "note": "AIM review - last 7 days"}}}

  Every {{name}} is HTML-escaped on the way in, so a value from a feed can
  never add markup. Keep the CSS to what litehtml supports: block and
  flex layout, padding/margins, borders, solid and rgba colours, local
  images, and text. No grid, no gradients, no @import, no webfonts.
  Note: litehtml drops `gap` on a flex row whose children grow, so the
  cards below space themselves with margin-right instead.

  Colours are design tokens, not literals: `var(--page)`, `var(--ink)`,
  `var(--panel)`, `var(--accent)` and the rest of the palette in
  `renderers/theme.py`, spliced into the document as a `:root` block by
  `renderers/_html_compose.py`. Copy this file and use those names -- a
  literal hex here is the duplication the token layer removes.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: var(--page); color: var(--ink); font-family: sans-serif; }
  .wrap  { padding: 34px 40px; }
  .head  { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 3px solid var(--rule); padding-bottom: 12px; }
  .title { font-size: 40px; font-weight: bold; color: var(--accent); }
  .sub   { font-size: 24px; color: var(--muted); }
  .cards { display: flex; margin-top: 26px; }
  .card  { background: var(--panel); border: 1px solid var(--edge); padding: 20px 24px;
           margin-right: 18px; }
  .card.last { margin-right: 0; }
  .value { font-size: 72px; font-weight: bold; }
  .unit  { font-size: 20px; color: var(--muted); }
  .note  { margin-top: 28px; font-size: 26px; color: var(--muted-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="title">{{title}}</div>
      <div class="sub">{{sub}}</div>
    </div>
    <div class="cards">
      <div class="card"><div class="value">{{value}}</div>
        <div class="unit">{{unit}}</div></div>
      <div class="card last"><div class="value">{{value}}</div>
        <div class="unit">{{unit}}</div></div>
    </div>
    <div class="note">{{note}}</div>
  </div>
</body>
</html>
